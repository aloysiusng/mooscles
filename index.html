<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Mooscles — Workout Tracker</title>
    <style>
      :root{
        --bg:#f3eee3; --surface:#fffcf4; --surface2:#e8dfc9; --ink:#1a2e22; --muted:#6f7d70;
        --line:#ddd2b8; --accent:#c2410c; --accent-ink:#fff7ed; --accent-soft:rgba(194,65,12,.13);
        --pine:#1b4332; --pine-ink:#fffcf4; --pine-soft:rgba(27,67,50,.10);
        --gold:#b45309; --gold-soft:rgba(180,83,9,.14); --red:#c2410c; --danger:#b42318;
        --thumb-line:rgba(27,67,50,.14);
        color-scheme:light;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#0e1511; --surface:#18231c; --surface2:#243329; --ink:#f2ecdc; --muted:#9cab9f;
          --line:#2e4034; --accent:#f97316; --accent-soft:rgba(249,115,22,.20); --pine:#0f2a1e; --pine-soft:rgba(255,252,244,.08);
          --gold:#f0b429; --gold-soft:rgba(240,180,41,.14);
          --thumb-line:rgba(255,255,255,.14);
          color-scheme:dark;
        }
      }
      *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
      html,body{margin:0;padding:0;touch-action:manipulation;}
      button,[role="button"],a,label,summary,select,input,textarea,.rowitem,.setrow,.check,.chip,.tabbar button,.taphead,.amrap-ex .tick,.roundcount button{touch-action:manipulation;}
      body{
        background:var(--bg); color:var(--ink);
        font-family:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        font-size:16px; line-height:1.4;
      }
      button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem;}
      button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
      input,select,textarea{font:inherit;color:var(--ink);}
      .shell{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;}
      @media (min-width:600px){ .shell{border-left:1px solid var(--line);border-right:1px solid var(--line);} }
      main{padding:0 16px 190px;}
      /* ---------- headers ---------- */
      .pagehead{padding:22px 2px 10px;}
      .pagehead h1{font-family:"Barlow Condensed","Barlow",sans-serif;font-size:38px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:.95;margin:0;color:var(--pine);}
      @media (prefers-color-scheme: dark){ .pagehead h1{color:var(--ink);} }
      .pagehead p{color:var(--muted);margin:4px 0 0;font-size:15px;}
      .topbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 8px;display:flex;align-items:center;gap:10px;}
      .topbar h1{font-family:"Barlow Condensed","Barlow",sans-serif;font-size:26px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .iconbtn{width:40px;height:40px;min-height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);font-size:18px;flex-shrink:0;}
      /* ---------- cards & lists ---------- */
      .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px;box-shadow:0 1px 0 var(--line);}
      .card h3{margin:0 0 2px;font-size:16px;font-weight:700;}
      .card .sub{color:var(--muted);font-size:13.5px;}
      .rowitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;min-height:64px;}
      .rowitem .grow{flex:1;min-width:0;}
      .rowitem .t{font-weight:650;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .rowitem .s{color:var(--muted);font-size:13px;margin-top:1px;}
      .chev{color:var(--muted);font-size:20px;flex-shrink:0;}
      .thumb{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;background:#fffcf4;border:1px solid var(--thumb-line);overflow:hidden;}
      .sectionlabel{font-family:"Barlow Condensed","Barlow",sans-serif;font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pine);margin:22px 2px 10px;}
      @media (prefers-color-scheme: dark){ .sectionlabel{color:var(--muted);} }
      .empty{border:1.5px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--muted);font-size:14.5px;background:var(--pine-soft);}
      .empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:4px;}
      /* ---------- buttons ---------- */
      .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;letter-spacing:.02em;text-transform:uppercase;padding:10px 16px;}
      .btn:active{opacity:.85;}
      .btn.secondary{background:var(--surface);color:var(--pine);border:1.5px solid var(--pine);}
      @media (prefers-color-scheme: dark){ .btn.secondary{color:var(--ink);border-color:var(--line);} }
      .btn.ghost{background:transparent;color:var(--accent);border:0;min-height:44px;}
      .btn.danger{background:var(--surface);color:var(--danger);border:1px solid var(--line);}
      .btn.small{width:auto;min-height:40px;padding:6px 14px;font-size:14.5px;border-radius:10px;}
      .btn[disabled]{opacity:.45;pointer-events:none;}
      /* ---------- chips ---------- */
      .chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;}
      .chip{padding:7px 13px;min-height:36px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--muted);}
      .chip.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink);}
      /* ---------- inputs ---------- */
      .search{width:100%;min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-size:16px;margin:0 0 12px;}
      .field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 5px;}
      .field input,.field select{width:100%;min-height:48px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 12px;font-size:16px;}
      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
      /* ---------- bottom nav ---------- */
      .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:40;
        background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
      .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;min-height:52px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600;}
      .tabbar button .ic{font-size:21px;line-height:1;}
      .tabbar button.on{color:var(--accent);background:var(--accent-soft);}
      .tabbar button .dot{position:absolute;}
      .tabbadge{position:relative;}
      .tabbadge::after{content:"";position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:99px;background:var(--accent);display:none;}
      .tabbadge.live::after{display:block;}
      /* ---------- logger ---------- */
      .loghead{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 10px;}
      .logtitle{width:100%;background:transparent;border:0;font-family:"Barlow Condensed","Barlow",sans-serif;font-size:28px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:4px 0;min-height:36px;}
      .logtitle:focus{outline:none;border-bottom:2px solid var(--accent);}
      .logmeta{display:flex;gap:14px;color:var(--muted);font-size:13.5px;font-weight:600;margin-top:2px;flex-wrap:wrap;}
      .progress{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px;}
      .progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease;}
      .excard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 8px;margin:0 0 14px;}
      .excard.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
      .exhead{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
      .exhead .grow{flex:1;min-width:0;}
      .exhead .t{font-weight:700;font-size:16px;}
      .exhead .s{color:var(--muted);font-size:12.5px;}
      .restpill{flex-shrink:0;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:7px 11px;min-height:36px;}
      .setgrid{display:grid;grid-template-columns:40px 1fr 74px 64px 48px 26px;gap:6px;align-items:center;}
      .setgrid.head{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;padding:4px 0 2px;}
      .setrow{padding:5px 0;border-radius:10px;}
      .setrow.done .num{background:var(--accent);color:#fff;border-color:var(--accent);}
      .setrow.nextset{animation:pulse 1.6s ease-in-out infinite;border-radius:10px;}
      @keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft);}50%{box-shadow:0 0 0 3px var(--accent-soft);}}
      @media (prefers-reduced-motion: reduce){ .setrow.nextset{animation:none;box-shadow:0 0 0 2px var(--accent);} }
      .num{width:34px;height:34px;min-height:34px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;justify-self:center;}
      .num.warmup{color:var(--gold);border-color:var(--gold);}
      .prev{font-size:13.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;}
      .prev b{color:var(--ink);font-weight:600;}
      .setinput{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:17px;font-weight:650;padding:6px 2px;font-variant-numeric:tabular-nums;}
      .setinput:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface);}
      .setrow.done .setinput{background:var(--accent-soft);border-color:transparent;}
      .check{width:48px;height:48px;min-height:48px;border-radius:12px;background:var(--surface2);color:var(--muted);font-size:21px;display:flex;align-items:center;justify-content:center;justify-self:end;}
      .setrow.done .check{background:var(--accent);color:#fff;}
      .setdel{width:26px;height:40px;min-height:40px;color:var(--muted);font-size:15px;}
      .prtag{display:inline-block;font-size:11px;font-weight:800;color:var(--gold);background:var(--gold-soft);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px;}
      .addset{width:100%;min-height:44px;color:var(--accent);font-weight:700;font-size:14.5px;border-top:1px solid var(--line);margin-top:6px;}
      /* ---------- rest bar ---------- */
      .restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:540px;z-index:45;
        background:var(--pine);color:#fffcf4;border-radius:10px;padding:12px 14px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.35);}
      .restbar.show{display:block;}
      .restbar .rt{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}
      .restbar .rl{font-size:12.5px;opacity:.75;font-weight:600;}
      .restbar .rrow{display:flex;align-items:center;gap:10px;}
      .restbar .rbtns{display:flex;gap:6px;margin-left:auto;}
      .restbar .rbtns button{min-height:40px;padding:6px 12px;border-radius:10px;background:rgba(127,127,140,.35);color:inherit;font-weight:700;font-size:14px;}
      .restbar .rprog{height:5px;border-radius:99px;background:rgba(127,127,140,.4);margin-top:10px;overflow:hidden;}
      .restbar .rprog i{display:block;height:100%;background:var(--accent);transition:width .5s linear;}
      /* ---------- sheet / modal ---------- */
      .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;}
      .scrim.show{display:block;}
      .sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(105%);bottom:0;width:100%;max-width:560px;z-index:61;
        background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transition:transform .25s ease;max-height:86dvh;overflow-y:auto;}
      .sheet.show{transform:translateX(-50%) translateY(0);}
      .sheet h2{margin:0 0 4px;font-family:"Barlow Condensed","Barlow",sans-serif;font-size:26px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
      .sheet .sub{color:var(--muted);font-size:14px;margin:0 0 14px;}
      .restopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
      .restopts button{min-height:52px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:16px;}
      .restopts button.on{background:var(--accent);color:#fff;}
      /* ---------- toast ---------- */
      .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-16px);top:calc(12px + env(safe-area-inset-top));z-index:80;
        background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;border-radius:12px;padding:12px 18px;opacity:0;pointer-events:none;transition:all .25s ease;max-width:calc(100% - 32px);text-align:center;}
      .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
      /* ---------- stats / misc ---------- */
      .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 12px;}
      .stat{background:var(--pine);border:1px solid var(--pine);border-radius:10px;padding:12px 10px;text-align:center;color:var(--pine-ink);}
      .stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
      .stat .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;}
      .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;}
      .kv:last-child{border-bottom:0;}
      .kv span{color:var(--muted);}
      .kv b{font-variant-numeric:tabular-nums;}
      table.sets{width:100%;border-collapse:collapse;font-size:14.5px;}
      table.sets th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px 6px 0;}
      table.sets td{padding:5px 6px 5px 0;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);}
      .note{font-size:13.5px;color:var(--muted);line-height:1.5;}
      .gold{color:var(--gold);font-weight:700;}
      .danger-text{color:var(--danger);}
      .hidden{display:none !important;}
      .fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:35;width:56px;height:56px;min-height:56px;border-radius:999px;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 8px 22px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;}
      .switchrow{display:flex;align-items:center;gap:10px;padding:10px 0;}
      .switchrow .grow{flex:1;}
      .switchrow input{width:22px;height:22px;min-height:22px;accent-color:var(--accent);}
      svg.chart{width:100%;height:auto;display:block;}
      .banner{background:var(--pine-soft);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 12px;font-size:14.5px;}
      .banner b{display:block;font-size:15.5px;margin-bottom:2px;}
      .stat .v{color:var(--pine-ink);} .stat .l{color:rgba(255,252,244,.78);}
      /* ---------- exercise detail / demo ---------- */
      .field textarea{width:100%;min-height:76px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:9px 12px;font-size:16px;resize:vertical;}
      .rowitem.clickable{cursor:pointer;}
      .rowitem.clickable:active{opacity:.85;}
      .taphead{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding:0;background:none;border:0;cursor:pointer;color:inherit;}
      .demo-stage{background:radial-gradient(circle at 50% 88%, var(--pine-soft) 0 34%, transparent 35%), var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px 4px;text-align:center;margin:0 0 12px;overflow:hidden;}
      .demo-stage svg{width:210px;height:210px;max-width:72vw;}
      .demo-cap{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding:2px 0 8px;}
      .howto h3{margin:0 0 6px;}
      .howto ul{margin:6px 0 0;padding:0;list-style:none;}
      .howto li{padding:7px 0 7px 26px;position:relative;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45;}
      .howto li:first-child{border-top:0;}
      .howto li::before{content:"✓";position:absolute;left:2px;top:7px;width:18px;height:18px;border-radius:50%;background:var(--pine);color:var(--pine-ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
      .howto .focus li::before{content:"★";background:var(--accent);color:#fff;}
      .prog-delta{font-weight:800;color:var(--pine);}
      @media (prefers-color-scheme: dark){ .prog-delta{color:var(--gold);} }
      .single-dot{display:flex;align-items:center;gap:12px;padding:8px 2px 2px;}
      .single-dot .dot{width:16px;height:16px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 0 6px var(--accent-soft);}
      .note-ind{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--pine);background:var(--pine-soft);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-top:5px;max-width:100%;}
      @media (prefers-color-scheme: dark){ .note-ind{color:var(--gold);background:var(--gold-soft);} }
      .note-preview{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
      .exnote-area{width:100%;min-height:220px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;font-size:16px;line-height:1.55;resize:vertical;font-family:inherit;color:var(--ink);}
      .exnote-area:focus{outline:2px solid var(--accent);outline-offset:-1px;}
      .exnote-meta{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45;}
      /* ---------- reel routines: AMRAP + notes ---------- */
      .modebadge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:6px;padding:2px 7px;vertical-align:2px;margin-left:6px;}

      .routine-notes{font-size:14.5px;line-height:1.55;}
      .routine-notes p{margin:0 0 8px;}
      .routine-notes p:last-child{margin-bottom:0;}
      .creditline{font-size:13.5px;color:var(--muted);margin-top:10px;}
      .creditline a{color:var(--accent);font-weight:700;}
      .phase-note{font-size:13.5px;color:var(--accent);font-weight:650;margin-top:2px;}
      .amrap-clock{font-family:"Barlow Condensed","Barlow",sans-serif;font-size:76px;font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--pine);padding:6px 0 0;}
      @media (prefers-color-scheme: dark){ .amrap-clock{color:var(--ink);} }
      .amrap-clock.done{color:var(--accent);}
      .roundcount{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 4px;}
      .roundcount .n{font-size:44px;font-weight:800;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;}
      .roundcount button{width:52px;height:52px;min-height:52px;border-radius:50%;background:var(--surface);border:1.5px solid var(--pine);font-size:26px;font-weight:800;color:var(--pine);display:flex;align-items:center;justify-content:center;}
      @media (prefers-color-scheme: dark){ .roundcount button{color:var(--ink);border-color:var(--line);} }
      .amrap-ex{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
      .amrap-ex:first-of-type{border-top:0;}
      .amrap-ex .reps{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
      .amrap-ex .tick{width:44px;height:44px;min-height:44px;border-radius:12px;background:var(--surface2);color:var(--muted);font-size:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
      .amrap-ex.tickdone .tick{background:var(--accent);color:#fff;}
      .amrap-ex.tickdone .t{color:var(--muted);text-decoration:line-through;}
    </style>
  </head>
  <body>
    <div class="shell">
      <main id="app"></main>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Main">
      <button data-tab="train"><span class="ic">🏋️</span>Train</button>
      <button data-tab="routines"><span class="ic">📋</span>Routines</button>
      <button data-tab="exercises"><span class="ic">💪</span>Exercises</button>
      <button data-tab="history"><span class="ic">🕘</span>History</button>
      <button data-tab="measures"><span class="ic">📏</span>Measures</button>
    </nav>

      return out;

    function loadState(){
      try{ var raw = localStorage.getItem(LS_KEY); if(raw){ var s = JSON.parse(raw); if(s && typeof s==="object") return normalizeState(s); } }catch(e){}

      if(!id) return "";

      if(ex && ex.notes) return ex.notes;

    function loadDraft(){

    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
    function fmtNum(n){ if(n==null || n==="" || isNaN(n)) return "–"; var v = Math.round(n*100)/100; return String(v); }
    function fmtVol(kg){ if(kg>=1000) return (Math.round(kg/100)/10).toLocaleString()+" t"; return Math.round(kg).toLocaleString()+" kg"; }
    function fmtClock(sec){ sec=Math.max(0,Math.floor(sec)); var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h>0? h+":" + String(m).padStart(2,"0") : m) + ":" + String(s).padStart(2,"0"); }
    function fmtRest(sec){ if(!sec) return "Off"; var m=Math.floor(sec/60), s=sec%60; return m===0 ? s+"s" : (s===0 ? m+":00" : m+":"+String(s).padStart(2,"0")); }

    function thumbKind(name, group){

        if(/turkish|get-up|windmill/.test(n)) return "core";

        if(/row/.test(n)) return "bentRow";

      if(/bench press|close grip bench|chest press|floor press|push up|push-up|pushup/.test(n)) return "bench";

      if(/leg extension/.test(n)) return "legExtension";
      if(/leg curl|hamstring curl/.test(n)) return "legCurl";
      if(/calf/.test(n)) return "calf";
      if(/overhead press|shoulder press|arnold|military/.test(n)) return "overhead";
      if(/lateral raise|rear delt|face pull|reverse fly|upright row|shrug/.test(n)) return "raise";
      if(/pull up|pull-up|chin up|chin-up|lat pulldown|pulldown|straight arm/.test(n)) return "pull";
      if(/tricep|skullcrusher|kickback|pushdown/.test(n)) return "tricep";
      if(/curl/.test(n)) return "curl";
      if(/fly|crossover|pec deck/.test(n)) return "fly";
      if(/dip/.test(n)) return "dip";
      if(/lunge|split squat|step up|step-up/.test(n)) return "lunge";
      if(/crunch|sit up|sit-up|leg raise|twist|plank/.test(n)) return "core";
      if(/row/.test(n)) return "row";
      if(g.indexOf("chest")>=0) return "bench";
      if(g.indexOf("back")>=0) return "row";
      if(g.indexOf("bicep")>=0) return "curl";
      if(g.indexOf("tricep")>=0) return "tricep";
      if(g.indexOf("shoulder")>=0) return "overhead";

      if(/core|ab/.test(g)) return "core";

        kettlebell:'<animateTransform attributeName="transform" type="rotate" values="-4 32 36;5 32 36;-4 32 36" dur="1.1s" repeatCount="indefinite"/>',

<script>
"use strict";
/* ---------------- history queries ---------------- */
function sortedWorkouts(){ return S.workouts.slice().sort(function(a,b){ return a.startedAt===b.startedAt ? 0 : (b.startedAt < a.startedAt ? -1 : 1); }); }
function prevFor(exerciseId){
  var ws = sortedWorkouts();
  for(var i=0;i<ws.length;i++){
    var we = ws[i].exercises.find(function(e){ return e.exerciseId===exerciseId; });
    if(we){
      var sets = we.sets.filter(function(s){ return s.completed; });
      if(sets.length) return { title: ws[i].title, date: ws[i].startedAt, sets: sets };
    }
  }
  return null;
}
function bestsFor(exerciseId){
  var bw=null, b1=null;
  S.workouts.forEach(function(w){ w.exercises.forEach(function(we){
    if(we.exerciseId!==exerciseId) return;
    we.sets.forEach(function(s){
      if(!s.completed || s.setType==="warmup" || s.weightKg==null) return;
      if(bw==null || s.weightKg>bw) bw=s.weightKg;
      var e = est1rm(s.weightKg, s.reps);
      if(e!=null && (b1==null || e>b1)) b1=e;
    });
  }); });
  return { bestWeight:bw, best1rm:b1 };
}
function exerciseHistory(exerciseId){
  var out=[];
  sortedWorkouts().forEach(function(w){
    var we = w.exercises.find(function(e){ return e.exerciseId===exerciseId; });
    if(we) out.push({ workout:w, we:we });
  });
  return out;
}
function lineChart(values, labels){
  if(values.length<2) return "";
  var W=340,H=120,P=14, max=Math.max.apply(null,values), min=Math.min.apply(null,values);
  if(max===min){ max+=1; min-=1; }
  var pts = values.map(function(v,i){
    var x = P + i*(W-2*P)/(values.length-1);
    var y = H-P-6 - (v-min)*(H-2*P-12)/(max-min);
    return [Math.round(x*10)/10, Math.round(y*10)/10];
  });
  var line = pts.map(function(p){ return p[0]+","+p[1]; }).join(" ");
  var dots = pts.map(function(p){ return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="var(--accent)"/>'; }).join("");
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Progress chart">'
    + '<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots
    + '<text x="'+P+'" y="12" font-size="11" fill="var(--muted)">'+fmtNum(max)+' kg</text>'
    + '<text x="'+P+'" y="'+(H-2)+'" font-size="11" fill="var(--muted)">'+fmtNum(min)+' kg</text>'
    + '<text x="'+(W-P)+'" y="12" font-size="11" text-anchor="end" fill="var(--muted)">'+esc(labels[labels.length-1]||"")+'</text>'
    + '<text x="'+(W-P)+'" y="'+(H-2)+'" font-size="11" text-anchor="end" fill="var(--muted)">'+esc(labels[0]||"")+'</text></svg>';
}

/* ---------------- sheets ---------------- */
var sheetCb = null;
function openSheet(html){ var sh=document.getElementById("sheet"); sh.innerHTML=html; sh.scrollTop=0; sh.classList.add("show"); document.getElementById("scrim").classList.add("show"); }
function closeSheet(){ document.getElementById("sheet").classList.remove("show"); document.getElementById("scrim").classList.remove("show"); sheetCb=null; }
document.getElementById("scrim").addEventListener("click", closeSheet);

var pickerState = { q:"", cb:null };
function openPicker(cb){
  pickerState = { q:"", cb:cb };
  openSheet('<h2>Add Exercise</h2><p class="sub">Search the catalogue or create your own below.</p>'
    + '<input class="search" id="pickerSearch" type="search" placeholder="Search exercises" autocomplete="off" />'
    + '<div id="pickerList"></div>'
    + '<button class="btn secondary" onclick="openCustomExercise()">+ Create custom exercise</button>');
  document.getElementById("pickerSearch").addEventListener("input", function(e){ pickerState.q = e.target.value; renderPickerList(); });
  renderPickerList();
  setTimeout(function(){ var i=document.getElementById("pickerSearch"); if(i) i.focus(); }, 80);
}
function renderPickerList(){
  var q = pickerState.q.trim().toLowerCase();
  var list = allExercises().filter(function(e){ return !q || e.name.toLowerCase().indexOf(q)>=0 || e.muscleGroup.toLowerCase().indexOf(q)>=0; });
  var el = document.getElementById("pickerList"); if(!el) return;
  if(!list.length){ el.innerHTML = '<div class="empty">No exercises match.</div>'; return; }
  el.innerHTML = list.slice(0,200).map(function(e){
    var hasN = hasExerciseNote(e.id);
    return '<button class="rowitem" onclick="pickExercise(\''+e.id+'\')">'+thumb(e.name,e.muscleGroup,44)
      + '<span class="grow"><span class="t">'+esc(e.name)+'</span><span class="s" style="display:block">'+esc(e.muscleGroup)+' · '+esc(e.equipment)+'</span>'+(hasN?'<span class="note-preview">📝 '+esc(notePreviewText(e.id))+'</span>':'')+'</span></button>';
  }).join("");
}
function pickExercise(id){ var cb = pickerState.cb; closeSheet(); if(cb) cb(id); }
function openCustomExercise(){
  openSheet('<h2>New Exercise</h2><p class="sub">Add your own exercise — it saves to your catalogue and you can use it in any routine or workout.</p>'
    + '<div class="field" style="margin-bottom:10px"><label for="ceName">Name</label><input id="ceName" placeholder="e.g. Smith Machine Squat" /></div>'
    + '<div class="grid2"><div class="field"><label for="ceMuscle">Muscle group</label><select id="ceMuscle">'
    + MUSCLES.map(function(m){ return '<option>'+m+'</option>'; }).join("") + '</select></div>'
    + '<div class="field"><label for="ceEquip">Equipment</label><input id="ceEquip" placeholder="e.g. Machine, Kettlebell, Cable" /></div></div>'
    + '<div class="field" style="margin-top:10px"><label for="ceNotes">Your notes for this exercise (optional)</label><textarea id="ceNotes" placeholder="Your own notes for this movement…"></textarea></div>'
    + '<button class="btn" style="margin-top:14px" onclick="saveCustomExercise()">Add exercise</button>');
  setTimeout(function(){ var i=document.getElementById("ceName"); if(i) i.focus(); }, 80);
}
function saveCustomExercise(){
  var name = document.getElementById("ceName").value.trim();
  if(!name){ toast("Give the exercise a name"); return; }
  if(exByName(name)){ toast("That exercise already exists"); return; }
  var notesEl = document.getElementById("ceNotes");
  var ex = { id:"x"+uid(), name:name, muscleGroup:document.getElementById("ceMuscle").value, equipment:document.getElementById("ceEquip").value.trim()||"Other", isCustom:true, notes: notesEl ? notesEl.value.trim() : "" };
  S.customExercises.push(ex); if(!S.exerciseNotes) S.exerciseNotes={}; if(ex.notes) S.exerciseNotes[ex.id]=ex.notes; save();
  var cb = pickerState.cb; closeSheet();
  toast("Exercise added: "+name);
  if(cb) cb(ex.id); else render();
}

function openRestPicker(current, cb){
  sheetCb = cb;
  var opts = REST_PRESETS.map(function(s){
    return '<button class="'+(s===current?"on":"")+'" onclick="pickRest('+s+')">'+(s===0?"Off":fmtRest(s))+'</button>';
  }).join("");
  openSheet('<h2>Rest Timer</h2><p class="sub">Starts automatically when you check a set.</p>'
    + '<div class="restopts">'+opts+'</div>'
    + '<div class="grid2"><div class="field"><label for="rcMin">Minutes</label><input id="rcMin" type="number" min="0" max="30" inputmode="numeric" placeholder="1" /></div>'
    + '<div class="field"><label for="rcSec">Seconds</label><input id="rcSec" type="number" min="0" max="59" inputmode="numeric" placeholder="30" /></div></div>'
    + '<button class="btn" style="margin-top:14px" onclick="pickRestCustom()">Use custom time</button>'
    + '<label class="switchrow"><span class="grow">Sound when rest ends</span><input type="checkbox" '+(S.prefs.sound?"checked":"")+' onchange="setPref(\'sound\',this.checked)" /></label>'
    + '<label class="switchrow"><span class="grow">Vibrate when rest ends</span><input type="checkbox" '+(S.prefs.vibrate?"checked":"")+' onchange="setPref(\'vibrate\',this.checked)" /></label>');
}
function pickRest(sec){ var cb = sheetCb; closeSheet(); if(cb) cb(sec); }
function pickRestCustom(){
  var m = parseInt(document.getElementById("rcMin").value||"0",10)||0;
  var s = parseInt(document.getElementById("rcSec").value||"0",10)||0;
  pickRest(Math.max(0, Math.min(1800, m*60+s)));
}
function confirmSheet(title, body, okLabel, cb){
  sheetCb = cb;
  openSheet('<h2>'+esc(title)+'</h2><p class="sub">'+esc(body)+'</p>'
    + '<button class="btn danger" onclick="confirmYes()">'+esc(okLabel)+'</button>'
    + '<button class="btn ghost" onclick="closeSheet()">Cancel</button>');
}
function confirmYes(){ var cb = sheetCb; closeSheet(); if(cb) cb(); }

/* ---------------- router ---------------- */
var route = { name: draft ? "train" : "train" };
var ui = { exSearch:"", exMuscle:"All", routineDraft:null, exReturn:"exercises" };
function openExerciseDetail(id, from){ ui.exReturn = from||"exercises"; go("exerciseDetail", id); }
function go(name, param){ route = { name:name, param:param }; render(); window.scrollTo(0,0); }
document.querySelectorAll("#tabbar button").forEach(function(b){
  b.addEventListener("click", function(){
    var t = b.getAttribute("data-tab");
    if(t==="train" && draft){ go(draft.mode==="amrap" ? "amrap" : "logger"); return; }
    go(t);
  });
});
function render(){
  var app = document.getElementById("app");
  var tabFor = { train:"train", logger:"train", amrap:"train", summary:"train", routines:"routines", routineEdit:"routines",
    exercises:"exercises", exerciseDetail:"exercises", history:"history", workoutDetail:"history",
    measures:"measures", measureEdit:"measures" }[route.name] || "train";
  document.querySelectorAll("#tabbar button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-tab")===tabFor);
    if(b.getAttribute("data-tab")==="train") b.classList.toggle("live", !!draft);
  });
  document.querySelectorAll("#tabbar button")[0].classList.add("tabbadge");
  var html = "";
  if(route.name==="train") html = vTrain();
  else if(route.name==="logger") html = vLogger();
  else if(route.name==="amrap") html = vAmrap();
  else if(route.name==="summary") html = vSummary();
  else if(route.name==="routines") html = vRoutines();
  else if(route.name==="routineEdit") html = vRoutineEdit();
  else if(route.name==="exercises") html = vExercises();
  else if(route.name==="exerciseDetail") html = vExerciseDetail();
  else if(route.name==="history") html = vHistory();
  else if(route.name==="workoutDetail") html = vWorkoutDetail();
  else if(route.name==="measures") html = vMeasures();
  else if(route.name==="measureEdit") html = vMeasureEdit();
  app.innerHTML = html;
  if(route.name==="logger") afterLoggerRender();
  if(route.name==="amrap") afterAmrapRender(); else stopAmrapTick();
  if(route.name==="exercises"){ var si=document.getElementById("exSearch"); if(si){ si.value=ui.exSearch; } }
}

/* ---------------- Train ---------------- */
function defaultTitle(){
  var h = new Date().getHours();
  var part = h<11 ? "Morning" : h<17 ? "Afternoon" : "Evening";
  return part + " Workout";
}
function vTrain(){
  var h = '<div class="pagehead"><h1>Mooscles</h1><p>Log a workout, follow a routine, beat last time.</p></div>';
  if(draft && draft.mode==="amrap"){
    h += '<div class="banner"><b>AMRAP in progress</b>'+esc(draft.title)+' · '+(draft.amrapRounds||0)+' rounds so far'
      + '<button class="btn" style="margin-top:10px" onclick="go(\'amrap\')">Resume AMRAP</button>'
      + '<button class="btn ghost" onclick="discardDraft()">Discard</button></div>';
  } else if(draft){
    var done=0,total=0;
    draft.exercises.forEach(function(ex){ ex.sets.forEach(function(s){ total++; if(s.done) done++; }); });
    h += '<div class="banner"><b>Workout in progress</b>'+esc(draft.title)+' · '+done+'/'+total+' sets checked'
      + '<button class="btn" style="margin-top:10px" onclick="go(\'logger\')">Resume workout</button>'
      + '<button class="btn ghost" onclick="discardDraft()">Discard</button></div>';
  } else {
    h += '<button class="btn" onclick="startEmpty()">+ Start Empty Workout</button>';
  }
  h += '<div class="sectionlabel">My routines</div>';
  if(!S.routines.length){
    h += '<div class="empty"><b>No routines yet — no routine cap here</b>Build Push, Pull, Legs, Upper, Lower — as many as you run. Start from a template:</div>'
      + '<div class="chips" style="margin-top:12px">' + TEMPLATES.map(function(t,i){ return '<button class="chip" onclick="addTemplate('+i+')">'+esc(t.name)+'</button>'; }).join("") + '</div>'
      + '<button class="btn secondary" onclick="newRoutine()">+ Create routine</button>';
  } else {
    h += S.routines.map(function(r){ return routineRow(r, true); }).join("");
    h += '<button class="btn secondary" onclick="newRoutine()">+ New routine</button>';
  }
  var recent = sortedWorkouts().slice(0,3);
  if(recent.length){
    h += '<div class="sectionlabel">Recent workouts</div>' + recent.map(workoutRow).join("");
  }
  h += dataCard();
  return h;
}
function copyTemplateMeta(t, target){
  ["mode","durationMin","notes","weightGuide","scaling","creditName","creditUrl"].forEach(function(k){ if(t[k]!=null) target[k]=t[k]; });
  return target;
}
function routineNotesHtml(r){
  if(!r || (!r.notes && !r.weightGuide && !r.scaling && !r.creditUrl)) return "";
  var h = '<div class="card routine-notes"><h3>'+(r.mode==="amrap" ? "⏱ Timed AMRAP — how it works" : "About this routine")+'</h3>';
  if(r.notes) h += '<p>'+esc(r.notes)+'</p>';
  if(r.weightGuide) h += '<p><b>Which bell?</b> '+esc(r.weightGuide)+'</p>';
  if(r.scaling) h += '<p><b>Scaling.</b> '+esc(r.scaling)+'</p>';
  if(r.creditUrl) h += '<p class="creditline">Routine inspired by '+esc(r.creditName||"the creator")+'. <a href="'+esc(r.creditUrl)+'" target="_blank" rel="noopener">Watch the original reel ↗</a></p>';
  return h + '</div>';
}
function routineRow(r, withStart){
  var names = r.exercises.map(function(re){ var e=exById(re.exerciseId); return e?e.name:""; }).filter(Boolean);
  var sets = r.exercises.reduce(function(a,re){ return a+(re.sets||0); },0);
  var meta = r.mode==="amrap" ? r.exercises.length+' exercises · '+(r.durationMin||20)+'-min AMRAP · rounds count — tap to open' : r.exercises.length+' exercises · '+sets+' sets — tap to open';
  return '<div class="rowitem clickable" role="button" tabindex="0" onclick="editRoutine(\''+r.id+'\')" aria-label="Open routine '+esc(r.name)+'"><span class="grow"><span class="t">'+esc(r.name)+(r.mode==="amrap"?'<span class="modebadge">AMRAP '+(r.durationMin||20)+' min</span>':"")+'</span>'
    + '<span class="s" style="display:block">'+meta+'</span>'
    + '<span class="s" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(names.join(", "))+'</span></span>'
    + (withStart ? '<button class="btn small" onclick="event.stopPropagation();startRoutine(\''+r.id+'\')">Start</button>' : '')
    + '<span class="chev">›</span></div>';
}
function workoutRow(w){
  var vol = workoutVolume(w);
  var nEx = w.exercises.length;
  var nSets = w.exercises.reduce(function(a,e){ return a+e.sets.length; },0);
  var detail = w.amrapRounds!=null ? nEx+' exercises · '+w.amrapRounds+' rounds in '+(w.amrapDurationMin||20)+' min' : nEx+' exercises · '+nSets+' sets · '+fmtVol(vol);
  return '<button class="rowitem" onclick="go(\'workoutDetail\',\''+w.id+'\')"><span class="grow"><span class="t">'+esc(w.title)+(w.amrapRounds!=null?'<span class="modebadge">AMRAP</span>':"")+'</span>'
    + '<span class="s" style="display:block">'+fmtDate(w.startedAt)+'</span>'
    + '<span class="s" style="display:block">'+esc(detail)+'</span></span><span class="chev">›</span></button>';
}
function dataCard(){
  return '<div class="sectionlabel">Your data</div><div class="card"><h3>Stored on this device</h3>'
    + '<p class="sub" style="margin-bottom:12px">Your workouts live in this browser — no account, nothing uploaded. Back up before switching phones or clearing browser data.</p>'
    + '<div class="grid2"><button class="btn secondary" onclick="exportBackup()">Export backup</button>'
    + '<button class="btn secondary" onclick="importBackup()">Import backup</button>'
    + '<button class="btn secondary" onclick="exportCsv()">Export CSV</button>'
    + '<button class="btn secondary" onclick="importCsv()">Import CSV</button></div>'
    + '<p class="sub" style="margin-top:12px">Rest-timer sound and vibration settings live in the rest timer — tap any ⏱ pill during a workout.</p></div>';
}
function setPref(k,v){ S.prefs[k]=v; save(); }
function discardDraft(){
  confirmSheet("Discard workout?", "This in-progress workout will be deleted. Finished workouts in History are not affected.", "Discard", function(){
    draft=null; saveDraft(); stopRest(); stopAmrapTick(); go("train"); toast("Workout discarded");
  });
}

/* ---------------- Routines ---------------- */
function vRoutines(){
  var h = '<div class="pagehead"><h1>Routines</h1><p>'+S.routines.length+' routine'+(S.routines.length===1?"":"s")+' · unlimited routines, no cap.</p></div>';
  if(!S.routines.length){
    h += '<div class="empty"><b>No routines yet</b>Create one from scratch, or start from a template:</div>'
      + '<div class="chips" style="margin-top:12px">' + TEMPLATES.map(function(t,i){ return '<button class="chip" onclick="addTemplate('+i+')">'+esc(t.name)+'</button>'; }).join("") + '</div>';
  } else {
    h += S.routines.map(function(r){ return routineRow(r, true); }).join("");
    h += '<div class="sectionlabel">Add a template — incl. Kettlebell Complex</div><div class="chips">' + TEMPLATES.map(function(t,i){ return '<button class="chip" onclick="addTemplate('+i+')">'+esc(t.name)+'</button>'; }).join("") + '</div>';
  }
  h += '<button class="btn" onclick="newRoutine()">+ New Routine</button>';
  return h;
}
function addTemplate(i){
  var t = TEMPLATES[i];
  var r = copyTemplateMeta(t, { id:"r"+uid(), name:t.name, exercises: t.exercises.map(function(te){
    var e = exByName(te[0]);
    return { exerciseId: e?e.id:"", sets: te[1], reps: te[2], restSec: te[3] };
  }).filter(function(re){ return re.exerciseId; }) });
  S.routines.push(r); save(); toast("Routine added: "+t.name); render();
}
function newRoutine(){
  ui.routineDraft = { id:null, name:"", exercises:[] };
  go("routineEdit");
}
function editRoutine(id){
  var r = S.routines.find(function(x){ return x.id===id; });
  if(!r) return;
  ui.routineDraft = JSON.parse(JSON.stringify(r));
  ui.routineDraft.exercises = (ui.routineDraft.exercises||[]).filter(function(re){ return exById(re.exerciseId); });
  go("routineEdit");
}
function vRoutineEdit(){
  var rd = ui.routineDraft;
  if(!rd){ return '<div class="pagehead"><h1>Routine</h1></div><div class="empty">Nothing to edit.</div>'; }
  var h = '<div class="topbar"><button class="iconbtn" onclick="go(\'routines\')" aria-label="Back">‹</button><h1>'+(rd.id?"Edit Routine":"New Routine")+'</h1></div>';
  h += '<div class="field" style="margin-bottom:12px"><label for="rdName">Routine name</label><input id="rdName" value="'+esc(rd.name)+'" placeholder="e.g. Push Day" oninput="ui.routineDraft.name=this.value" /></div>';
  h += routineNotesHtml(rd);
  if(rd.mode==="amrap") h += '<p class="note" style="margin:0 0 12px">This is a timed AMRAP: the Reps column below is the reps per round. Sets and Rest do not apply — the clock and the rounds counter run the session.</p>';
  if(!rd.id && !rd.exercises.length){
    h += '<div class="sectionlabel">Start from a template</div><div class="chips">'
      + TEMPLATES.map(function(t,i){ return '<button class="chip" onclick="applyTemplate('+i+')">'+esc(t.name)+'</button>'; }).join("") + '</div>';
  }
  h += rd.exercises.map(function(re, idx){
    var e = exById(re.exerciseId); if(!e) return "";
    var hasNoteR = hasExerciseNote(e.id);
    return '<div class="excard"><div class="exhead"><button class="taphead" onclick="openExerciseDetail(\''+e.id+'\',\'routineEdit\')" aria-label="Open '+esc(e.name)+'">'+thumb(e.name,e.muscleGroup,44)
      + '<span class="grow"><span class="t">'+esc(e.name)+' ›</span><span class="s" style="display:block">'+esc(e.muscleGroup)+' · '+esc(e.equipment)+' · tap for demo, graph & notes</span>'+(hasNoteR?'<span class="note-preview">📝 '+esc(notePreviewText(e.id))+'</span>':'')+'</span></button>'
      + '<button class="iconbtn" aria-label="Move up" onclick="moveRoutineRow('+idx+',-1)">↑</button>'
      + '<button class="iconbtn" aria-label="Move down" onclick="moveRoutineRow('+idx+',1)">↓</button>'
      + '<button class="iconbtn" aria-label="Remove" onclick="removeRoutineRow('+idx+')">✕</button></div>'
      + '<div class="grid2" style="grid-template-columns:1fr 1fr 1fr;gap:8px">'
      + '<div class="field"><label>Sets</label><input type="number" min="1" max="20" inputmode="numeric" value="'+re.sets+'" oninput="ui.routineDraft.exercises['+idx+'].sets=parseInt(this.value||\'0\',10)" /></div>'
      + '<div class="field"><label>Reps</label><input value="'+esc(re.reps)+'" placeholder="8-12" oninput="ui.routineDraft.exercises['+idx+'].reps=this.value" /></div>'
      + '<div class="field"><label>Rest</label><button class="restpill" style="width:100%;min-height:48px;border-radius:10px" onclick="editRoutineRest('+idx+')">'+fmtRest(re.restSec)+'</button></div>'
      + '</div></div>';
  }).join("");
  h += '<button class="btn secondary" onclick="addToRoutine()">+ Add Exercise</button>';
  h += '<button class="btn" style="margin-top:12px" onclick="saveRoutine()">Save Routine</button>';
  if(rd.id) h += '<button class="btn danger" style="margin-top:10px" onclick="deleteRoutine()">Delete Routine</button>';
  return h;
}
function applyTemplate(i){
  var t = TEMPLATES[i]; var rd = ui.routineDraft;
  rd.name = rd.name || t.name;
  copyTemplateMeta(t, rd);
  rd.exercises = t.exercises.map(function(te){ var e=exByName(te[0]); return { exerciseId:e?e.id:"", sets:te[1], reps:te[2], restSec:te[3] }; }).filter(function(re){ return re.exerciseId; });
  render();
}
function addToRoutine(){ openPicker(function(id){ ui.routineDraft.exercises.push({ exerciseId:id, sets:3, reps:"8-12", restSec:90 }); render(); }); }
function moveRoutineRow(idx, dir){
  var a = ui.routineDraft.exercises, j = idx+dir;
  if(j<0 || j>=a.length) return;
  var tmp=a[idx]; a[idx]=a[j]; a[j]=tmp; render();
}
function removeRoutineRow(idx){ ui.routineDraft.exercises.splice(idx,1); render(); }
function editRoutineRest(idx){ openRestPicker(ui.routineDraft.exercises[idx].restSec, function(sec){ ui.routineDraft.exercises[idx].restSec = sec; render(); }); }
function saveRoutine(){
  var rd = ui.routineDraft;
  rd.name = (document.getElementById("rdName").value||"").trim();
  if(!rd.name){ toast("Give the routine a name"); return; }
  rd.exercises = rd.exercises.filter(function(re){ return re.exerciseId && exById(re.exerciseId); });
  if(!rd.exercises.length){ toast("Add at least one exercise"); return; }
  if(rd.exercises.some(function(re){ return !(re.sets>0); })){ toast("Every exercise needs at least 1 set"); return; }
  if(rd.id){
    var i = S.routines.findIndex(function(r){ return r.id===rd.id; });
    if(i>=0) S.routines[i] = rd;
  } else { rd.id = "r"+uid(); S.routines.push(rd); }
  save(); ui.routineDraft=null; toast("Routine saved"); go("routines");
}
function deleteRoutine(){
  var rd = ui.routineDraft;
  confirmSheet("Delete routine?", '"'+rd.name+'" will be removed. Your workout history stays.', "Delete", function(){
    S.routines = S.routines.filter(function(r){ return r.id!==rd.id; });
    save(); ui.routineDraft=null; go("routines"); toast("Routine deleted");
  });
}

/* ---------------- Exercises ---------------- */
function vExercises(){
  var q = ui.exSearch.trim().toLowerCase();
  var list = allExercises().filter(function(e){
    if(ui.exMuscle!=="All" && e.muscleGroup!==ui.exMuscle) return false;
    return !q || e.name.toLowerCase().indexOf(q)>=0 || e.muscleGroup.toLowerCase().indexOf(q)>=0;
  });
  var h = '<div class="pagehead"><h1>Exercises</h1><p>'+allExercises().length+' exercises in your catalogue. Tap any exercise for its demo, progression graph and your notes.</p></div>';
  h += '<button class="btn" style="margin-bottom:12px" onclick="openCustomExerciseStandalone()">+ Add New Exercise</button>';
  h += '<input class="search" id="exSearch" type="search" placeholder="Search exercises" autocomplete="off" oninput="ui.exSearch=this.value;renderExerciseList()" />';
  var muscles = ["All"].concat(MUSCLES.filter(function(m){ return allExercises().some(function(e){ return e.muscleGroup===m; }); }));
  h += '<div class="chips">' + muscles.map(function(m){ return '<button class="chip'+(ui.exMuscle===m?" on":"")+'" onclick="ui.exMuscle=\''+m+'\';render()">'+m+'</button>'; }).join("") + '</div>';
  h += '<div id="exList">' + exerciseListHtml(list) + '</div>';
  h += '<button class="btn secondary" onclick="openCustomExerciseStandalone()">+ Add New Exercise</button>';
  return h;
}
function exerciseListHtml(list){
  if(!list.length) return '<div class="empty">No exercises match.</div>';
  var groups = {};
  list.forEach(function(e){ (groups[e.muscleGroup] = groups[e.muscleGroup]||[]).push(e); });
  return Object.keys(groups).sort().map(function(g){
    return '<div class="sectionlabel">'+esc(g)+'</div>' + groups[g].map(function(e){
      var b = bestsFor(e.id);
      var sub = e.muscleGroup+' · '+e.equipment + (b.bestWeight!=null ? ' · Best '+fmtNum(b.bestWeight)+' kg' : '');
      var hasN = hasExerciseNote(e.id);
      return '<button class="rowitem" onclick="openExerciseDetail(\''+e.id+'\',\'exercises\')">'+thumb(e.name,e.muscleGroup,48)
        + '<span class="grow"><span class="t">'+esc(e.name)+(e.isCustom?' <span class="prtag" style="color:var(--accent);background:var(--accent-soft)">CUSTOM</span>':"")+(hasN?' <span class="note-ind">📝 Notes</span>':"")+'</span>'
        + '<span class="s" style="display:block">'+esc(sub)+'</span>'+(hasN?'<span class="note-preview">📝 '+esc(notePreviewText(e.id))+'</span>':'<span class="note-preview" style="opacity:.75">Tap to add notes</span>')+'</span><span class="chev">›</span></button>';
    }).join("");
  }).join("");
}
function renderExerciseList(){
  var el = document.getElementById("exList"); if(!el) return;
  var q = ui.exSearch.trim().toLowerCase();
  var list = allExercises().filter(function(e){
    if(ui.exMuscle!=="All" && e.muscleGroup!==ui.exMuscle) return false;
    return !q || e.name.toLowerCase().indexOf(q)>=0 || e.muscleGroup.toLowerCase().indexOf(q)>=0;
  });
  el.innerHTML = exerciseListHtml(list);
  var si = document.getElementById("exSearch");
  if(si && document.activeElement!==si){ si.value = ui.exSearch; }
}
function openCustomExerciseStandalone(){ pickerState = { q:"", cb:null }; openCustomExercise(); }
function vExerciseDetail(){
  var e = exById(route.param);
  if(!e) return '<div class="topbar"><button class="iconbtn" onclick="go(\''+(ui.exReturn||"exercises")+'\')" aria-label="Back">‹</button><h1>Exercise</h1></div><div class="empty">Exercise not found in the catalogue. It may have been a custom exercise from an older workout.</div>';
  var b = bestsFor(e.id);
  var hist = exerciseHistory(e.id);
  var totalSets = 0; hist.forEach(function(hx){ totalSets += hx.we.sets.filter(function(s){ return s.completed; }).length; });
  var backTo = ui.exReturn||"exercises";
  var h = '<div class="topbar"><button class="iconbtn" onclick="go(\''+backTo+'\')" aria-label="Back">‹</button><h1>'+esc(e.name)+'</h1></div>';
  h += '<div class="demo-stage">'+demoFigure(e.name, e.muscleGroup)+'<div class="demo-cap">▶ Looping movement demo · '+esc(e.muscleGroup)+' · '+esc(e.equipment)+'</div></div>';
  var myNote = getExerciseNotes(e.id);
  var myNoteHtml = myNote ? esc(myNote).replace(/\n/g,'<br>') : '';
  h += '<div class="sectionlabel">Your notes</div>';
  if(myNote){
    h += '<div class="card"><div style="font-size:15px;line-height:1.6;white-space:pre-wrap">'+myNoteHtml+'</div><p class="exnote-meta">Saved for '+esc(e.name)+' only — stays on this device and is included in your JSON backup.</p></div>';
    h += '<button class="btn secondary" onclick="openExerciseNoteEditor(\''+e.id+'\')">✏️ Edit notes</button>';
  } else {
    h += '<div class="card"><p class="sub" style="margin:0">No notes yet for this exercise. Add your own cues, reminders, weights or how it felt — they will be here every time you open this exercise.</p></div>';
    h += '<button class="btn" onclick="openExerciseNoteEditor(\''+e.id+'\')">📝 Add note</button>';
  }
  h += '<div class="statgrid"><div class="stat"><div class="v">'+(b.bestWeight!=null?fmtNum(b.bestWeight):"–")+'</div><div class="l">Best weight (kg)</div></div>'
    + '<div class="stat"><div class="v">'+(b.best1rm!=null?fmtNum(Math.round(b.best1rm)):"–")+'</div><div class="l">Est. 1RM (kg)</div></div>'
    + '<div class="stat"><div class="v">'+totalSets+'</div><div class="l">Sets logged</div></div></div>';
  var chartPts = hist.slice().reverse().map(function(hx){
    var top = null, top1 = null;
    hx.we.sets.forEach(function(s){ if(s.completed && s.weightKg!=null && (top==null || s.weightKg>top)) top=s.weightKg; var e1=est1rm(s.weightKg,s.reps); if(s.completed && e1!=null && (top1==null || e1>top1)) top1=e1; });
    return { v: top, v1: top1, d: hx.workout.startedAt };
  }).filter(function(p){ return p.v!=null; });
  h += '<div class="sectionlabel">Your progression</div>';
  if(chartPts.length>=2){
    var firstV = chartPts[0].v, lastV = chartPts[chartPts.length-1].v, delta = Math.round((lastV-firstV)*100)/100;
    h += '<div class="card"><h3>Top weight — line graph</h3><p class="sub" style="margin-bottom:6px">From '+fmtNum(firstV)+' kg to '+fmtNum(lastV)+' kg <span class="prog-delta">('+(delta>0?"+":"")+fmtNum(delta)+' kg)</span> across '+chartPts.length+' sessions</p>' + lineChart(chartPts.map(function(p){ return p.v; }), chartPts.map(function(p){ return fmtDateShort(p.d); })) + '</div>';
    var pts1 = chartPts.filter(function(p){ return p.v1!=null; });
    if(pts1.length>=2) h += '<div class="card"><h3>Estimated 1RM</h3>' + lineChart(pts1.map(function(p){ return Math.round(p.v1); }), pts1.map(function(p){ return fmtDateShort(p.d); })) + '</div>';
  } else if(chartPts.length===1){
    h += '<div class="card"><h3>Top weight — line graph</h3><div class="single-dot"><span class="dot"></span><span><b>'+fmtNum(chartPts[0].v)+' kg</b> on '+fmtDate(chartPts[0].d)+'<br><span class="sub">Log this exercise in one more workout and your progression line will draw itself here.</span></span></div></div>';
  } else {
    h += '<div class="empty"><b>No progression yet</b>Log '+esc(e.name)+' in a workout and your line graph will appear here.</div>';
  }
  h += '<div class="sectionlabel">History</div>';
  if(!hist.length) h += '<div class="empty">Not logged yet. It will show here after your first workout.</div>';
  h += hist.slice(0,12).map(function(hx){
    var sets = hx.we.sets.filter(function(s){ return s.completed; });
    var txt = sets.map(function(s){ return fmtNum(s.weightKg)+"×"+fmtNum(s.reps); }).join("  ·  ");
    return '<button class="rowitem" onclick="go(\'workoutDetail\',\''+hx.workout.id+'\')"><span class="grow"><span class="t">'+esc(hx.workout.title)+'</span>'
      + '<span class="s" style="display:block">'+fmtDate(hx.workout.startedAt)+'</span><span class="s" style="display:block">'+esc(txt)+'</span></span><span class="chev">›</span></button>';
  }).join("");
  if(e.isCustom) h += '<button class="btn danger" onclick="deleteCustomExercise(\''+e.id+'\')">Delete custom exercise</button>';
  return h;
}
function openExerciseNoteEditor(id){
  var e = exById(id); if(!e) return;
  var cur = getExerciseNotes(id);
  openSheet('<h2>'+(cur?'Edit notes':'Add note')+'</h2><p class="sub">Notes for '+esc(e.name)+' — only you see these. They save with this exercise and are included in your backup.</p>'
    + '<div class="field"><label for="exNoteEdit">Your notes</label><textarea id="exNoteEdit" class="exnote-area" placeholder="e.g. Form cues, what to focus on, grip / setup, weight to use, how it felt last time…">'+esc(cur)+'</textarea></div>'
    + '<button class="btn" style="margin-top:14px" onclick="saveExerciseNoteFromSheet(\''+id+'\')">Save notes</button>'
    + (cur ? '<button class="btn danger" style="margin-top:10px" onclick="clearExerciseNote(\''+id+'\')">Clear notes</button>' : '')
    + '<button class="btn ghost" onclick="closeSheet()">Cancel</button>');
  setTimeout(function(){ var i=document.getElementById("exNoteEdit"); if(i) i.focus(); }, 80);
}
function saveExerciseNoteFromSheet(id){
  var el = document.getElementById("exNoteEdit");
  var v = el ? el.value : "";
  setExerciseNotes(id, v);
  closeSheet();
  toast(v.trim() ? "Notes saved" : "Notes cleared");
  render();
}
function clearExerciseNote(id){
  setExerciseNotes(id, "");
  closeSheet();
  toast("Notes cleared");
  render();
}
function deleteCustomExercise(id){
  confirmSheet("Delete exercise?", "It will be removed from your catalogue. Past workouts keep their logged sets.", "Delete", function(){
    S.customExercises = S.customExercises.filter(function(x){ return x.id!==id; }); if(S.exerciseNotes) delete S.exerciseNotes[id];
    save(); go("exercises"); toast("Exercise deleted");
  });
}
</script>
<script>
"use strict";
/* ---------------- workout logger ---------------- */
var SET_TYPES = ["normal","warmup","dropset","failure"];
var SET_TYPE_SHORT = { normal:"", warmup:"W", dropset:"D", failure:"F" };
var tickTimer = null;

function newSet(prefill){
  return { setType:"normal", weight: prefill && prefill.weightKg!=null ? prefill.weightKg : null,
    reps: prefill && prefill.reps!=null ? prefill.reps : null, done:false };
}
function draftExercise(ex, setCount, targetReps, restSec){
  var prev = prevFor(ex.id);
  var bests = bestsFor(ex.id);
  var sets = [];
  var n = Math.max(1, setCount||3);
  for(var i=0;i<n;i++){
    var p = prev && prev.sets[i] ? prev.sets[i] : (prev && prev.sets.length ? prev.sets[prev.sets.length-1] : null);
    sets.push(newSet(p));
  }
  return { exerciseId: ex.id, name: ex.name, muscleGroup: ex.muscleGroup, equipment: ex.equipment,
    restSec: restSec!=null ? restSec : 90, targetReps: targetReps||"",
    prevSets: prev ? prev.sets : null, prevDate: prev ? prev.date : null,
    bestWeight: bests.bestWeight, best1rm: bests.best1rm, sets: sets };
}
function startEmpty(){
  if(draft){ go(draft.mode==="amrap" ? "amrap" : "logger"); return; }
  draft = { title: defaultTitle(), routineId:null, startedAt: new Date().toISOString(), exercises: [] };
  saveDraft(); go("logger");
}
function startRoutine(id){
  if(draft){
    confirmSheet("Workout already in progress", "Starting this routine will discard the workout you have open.", "Discard & start", function(){
      draft=null; saveDraft(); stopRest(); doStartRoutine(id);
    });
    return;
  }
  doStartRoutine(id);
}
function doStartRoutine(id){
  var r = S.routines.find(function(x){ return x.id===id; });
  if(!r) return;
  if(r.mode==="amrap"){
    var durMin = r.durationMin||20;
    draft = { title: r.name, routineId: r.id, startedAt: new Date().toISOString(), mode:"amrap",
      durationMin: durMin, notes: r.notes||"", weightGuide: r.weightGuide||"", scaling: r.scaling||"",
      creditName: r.creditName||"", creditUrl: r.creditUrl||"",
      amrapDurationSec: durMin*60, amrapRemainingSec: durMin*60, amrapEndsAt: null, amrapState:"ready",
      amrapRounds: 0, amrapWeightKg: null,
      exercises: r.exercises.map(function(re){
        var e = exById(re.exerciseId); if(!e) return null;
        var repsInt = parseInt(re.reps,10);
        return { exerciseId: e.id, name: e.name, muscleGroup: e.muscleGroup, equipment: e.equipment,
          targetReps: String(re.reps), repsPerRound: isNaN(repsInt)?null:repsInt, ticked:false, sets: [], restSec: 0 };
      }).filter(Boolean) };
    saveDraft(); go("amrap");
    return;
  }
  draft = { title: r.name, routineId: r.id, startedAt: new Date().toISOString(),
    exercises: r.exercises.map(function(re){
      var e = exById(re.exerciseId); if(!e) return null;
      return draftExercise(e, re.sets, re.reps, re.restSec);
    }).filter(Boolean) };
  saveDraft(); go("logger");
}
/* ---------------- AMRAP session ---------------- */
var amrapTimer = null;
function amrapRemaining(){
  if(!draft || draft.mode!=="amrap") return 0;
  if(draft.amrapState==="running" && draft.amrapEndsAt) return Math.max(0,(draft.amrapEndsAt - Date.now())/1000);
  return draft.amrapRemainingSec||0;
}
function vAmrap(){
  if(!draft || draft.mode!=="amrap") return '<div class="pagehead"><h1>No AMRAP open</h1></div><div class="empty">Start one from a routine marked AMRAP.</div><button class="btn" onclick="go(\'train\')">Back to Train</button>';
  var remain = amrapRemaining();
  var total = draft.amrapDurationSec||1200;
  var pct = total ? Math.round(remain/total*100) : 0;
  var stateLabel = { ready:"Ready when you are", running:"Clock running — keep moving", paused:"Paused", done:"Time! Pencils down" }[draft.amrapState] || "";
  var h = '<div class="loghead"><input class="logtitle" id="draftTitle" value="'+esc(draft.title)+'" aria-label="Workout title" oninput="draft.title=this.value;saveDraft()" />'
    + '<div class="logmeta"><span class="modebadge">AMRAP '+(draft.durationMin||20)+' min</span><span>'+esc(stateLabel)+'</span>'
    + '<span style="margin-left:auto"></span><button style="color:var(--danger);font-weight:700;min-height:36px" onclick="discardDraft()">Discard</button></div></div>';
  h += routineNotesHtml(draft);
  h += '<div class="card"><div class="amrap-clock'+(draft.amrapState==="done"?" done":"")+'" id="amrapTime">'+fmtClock(remain)+'</div>'
    + '<div class="progress"><i id="amrapProg" style="width:'+pct+'%"></i></div>'
    + '<div style="display:flex;gap:8px;margin-top:12px">'
    + (draft.amrapState==="running"
        ? '<button class="btn secondary" onclick="amrapPause()">⏸ Pause</button>'
        : '<button class="btn" onclick="amrapStart()">'+(draft.amrapState==="done"?"↺ Restart clock":"▶ Start clock")+'</button>')
    + (draft.amrapState==="paused" ? '<button class="btn secondary" onclick="amrapResetClock()">Reset</button>' : '')
    + '</div>'
    + '<div class="sectionlabel" style="text-align:center;margin-bottom:0">Rounds completed</div>'
    + '<div class="roundcount"><button onclick="amrapRoundsDelta(-1)" aria-label="One fewer round">−</button><span class="n" id="amrapRounds">'+(draft.amrapRounds||0)+'</span><button onclick="amrapRoundsDelta(1)" aria-label="One more round">+</button></div>'
    + '<p class="note" style="text-align:center;margin:0">Tick every move below as you finish it — ticking the last one banks the round for you.</p></div>';
  h += '<div class="card"><h3>This round</h3>' + draft.exercises.map(function(ex, ei){
    var hasNoteA = hasExerciseNote(ex.exerciseId);

      + '<span class="reps">× '+esc(ex.targetReps)+'</span>'

  }).join("") + '</div>';

    + '<input id="amrapWeight" type="number" min="0" step="0.5" inputmode="decimal" placeholder="e.g. 20" value="'+(draft.amrapWeightKg!=null?draft.amrapWeightKg:"")+'" oninput="draft.amrapWeightKg=this.value===\'\'?null:parseFloat(this.value);saveDraft()" /></div></div>';
  h += '<button class="btn" id="amrapFinishBtn" onclick="finishAmrap()">Finish & log '+(draft.amrapRounds||0)+' round'+((draft.amrapRounds||0)===1?"":"s")+'</button>';

function afterAmrapRender(){
  var ti = document.getElementById("draftTitle");
  if(ti && draft) ti.value = draft.title;

}
function stopAmrapTick(){ if(amrapTimer){ clearInterval(amrapTimer); amrapTimer = null; } }
function tickAmrap(){
  if(!draft || draft.mode!=="amrap" || draft.amrapState!=="running"){ stopAmrapTick(); return; }
  var remain = amrapRemaining();
  var el = document.getElementById("amrapTime");
  if(el) el.textContent = fmtClock(remain);
  var pr = document.getElementById("amrapProg");
  if(pr && draft.amrapDurationSec) pr.style.width = (remain/draft.amrapDurationSec*100) + "%";
  if(remain<=0){
    draft.amrapState = "done"; draft.amrapRemainingSec = 0; draft.amrapEndsAt = null;
    saveDraft(); stopAmrapTick();
    toast("⏰ Time! " + (draft.amrapRounds||0) + " rounds — log it below", 3600);
    chime([880,880,1318.5]); buzz([150,60,150]);
    render();
  }
}
function amrapStart(){
  if(!draft || draft.mode!=="amrap") return;
  if(draft.amrapState==="done" || amrapRemaining()<=0) draft.amrapRemainingSec = draft.amrapDurationSec;
  draft.amrapEndsAt = Date.now() + amrapRemaining()*1000;
  draft.amrapState = "running";
  saveDraft(); render();
}
function amrapPause(){
  if(!draft || draft.mode!=="amrap") return;
  draft.amrapRemainingSec = amrapRemaining();
  draft.amrapEndsAt = null; draft.amrapState = "paused";
  saveDraft(); render();
}
function amrapResetClock(){
  if(!draft || draft.mode!=="amrap") return;
  draft.amrapRemainingSec = draft.amrapDurationSec; draft.amrapEndsAt = null; draft.amrapState = "ready";
  saveDraft(); render();
}
function amrapRoundsDelta(d){
  if(!draft || draft.mode!=="amrap") return;
  draft.amrapRounds = Math.max(0, (draft.amrapRounds||0) + d);
  saveDraft();
  var el = document.getElementById("amrapRounds");
  if(el) el.textContent = draft.amrapRounds; else render();
  var fb = document.getElementById("amrapFinishBtn");
  if(fb) fb.textContent = "Finish & log " + draft.amrapRounds + " round" + (draft.amrapRounds===1 ? "" : "s");

function amrapTick(ei){
  if(!draft || draft.mode!=="amrap") return;
  var ex = draft.exercises[ei]; if(!ex) return;
  ex.ticked = !ex.ticked;
  buzz(25);
  if(draft.exercises.length && draft.exercises.every(function(x){ return x.ticked; })){
    draft.amrapRounds = (draft.amrapRounds||0) + 1;
    draft.exercises.forEach(function(x){ x.ticked = false; });
    saveDraft(); render();
    toast("🎉 Round " + draft.amrapRounds + " banked — go again!");
    return;
  }
  saveDraft(); render();
}
function finishAmrap(){
  if(!draft || draft.mode!=="amrap") return;
  if(!draft.exercises.length){ toast("This AMRAP has no exercises left — discard it and start again."); return; }
  var rounds = draft.amrapRounds||0;
  if(rounds<=0){ toast("Complete at least one full round first — tick every move to bank a round."); return; }
  var total = draft.amrapDurationSec||1200;
  var elapsed = Math.round(total - amrapRemaining());
  if(draft.amrapState==="ready") elapsed = Math.max(1, Math.round((Date.now() - new Date(draft.startedAt).getTime())/1000));
  elapsed = Math.max(1, Math.min(total, elapsed || 1));
  var wKg = draft.amrapWeightKg;
  var kept = draft.exercises.map(function(ex){
    var sets = [];
    for(var i=0;i<rounds;i++) sets.push({ setType:"normal", weightKg: (wKg!=null && !isNaN(wKg)) ? wKg : null, reps: ex.repsPerRound, completed:true });
    return { exerciseId: ex.exerciseId, name: ex.name, muscleGroup: ex.muscleGroup, sets: sets };
  });
  var now = new Date();
  var w = { id:"w"+uid(), title: draft.title.trim()||"AMRAP Workout", routineId: draft.routineId,
    startedAt: draft.startedAt, endedAt: now.toISOString(), durationSec: elapsed,
    exercises: kept, amrapRounds: rounds, amrapDurationMin: draft.durationMin||20, prCount: 0 };
  S.workouts.push(w); save();
  draft = null; saveDraft(); stopAmrapTick(); stopRest();
  go("summary", w.id);
}
function draftCounts(){
  var done=0,total=0;
  if(draft) draft.exercises.forEach(function(ex){ ex.sets.forEach(function(s){ total++; if(s.done) done++; }); });
  return { done:done, total:total };
}
function nextSetPos(){
  if(!draft) return null;
  for(var i=0;i<draft.exercises.length;i++){
    for(var j=0;j<draft.exercises[i].sets.length;j++){
      if(!draft.exercises[i].sets[j].done) return { ex:i, set:j };
    }
  }
  return null;
}
function isPR(ex, s){
  if(s.setType==="warmup" || s.weight==null) return false;
  if(ex.bestWeight!=null && s.weight > ex.bestWeight) return true;
  var e1 = est1rm(s.weight, s.reps);
  if(e1!=null && ex.best1rm!=null && e1 > ex.best1rm + 0.01 && !(ex.bestWeight!=null && s.weight > ex.bestWeight)) return true;
  return false;
}

function setDraftVal(ei, si, field, val){
  if(!draft || !draft.exercises[ei] || !draft.exercises[ei].sets[si]) return;
  var s = draft.exercises[ei].sets[si];
  var oldWeight = s.weight;
  var oldReps = s.reps;
  var v = val==="" ? null : parseFloat(val);
  var newVal = isNaN(v) ? null : Math.max(0, v);
  s[field] = newVal;
  if(field==="weight" && oldWeight!==newVal) cascadeWeight(ei, si, oldWeight, newVal);
  if(field==="reps" && oldReps!==newVal) cascadeReps(ei, si, oldReps, newVal);
  saveDraft();
}
function cascadeWeight(ei, si, oldWeight, newWeight){
  var ex = draft.exercises[ei];
  if(!ex) return;
  for(var j=si+1;j<ex.sets.length;j++){
    var later = ex.sets[j];
    if(later.done) continue;
    if(later.weight==null || later.weight===oldWeight){
      later.weight = newWeight;
      var input = document.querySelector('[data-winput="'+ei+'-'+j+'"]');
      if(input && document.activeElement!==input) input.value = newWeight!=null ? newWeight : "";
    }
  }
}
function cascadeReps(ei, si, oldReps, newReps){
  var ex = draft.exercises[ei];
  if(!ex) return;
  for(var j=si+1;j<ex.sets.length;j++){
    var later = ex.sets[j];
    if(later.done) continue;
    if(later.reps==null || later.reps===oldReps){
      later.reps = newReps;
      var input = document.querySelector('[data-rinput="'+ei+'-'+j+'"]');
      if(input && document.activeElement!==input) input.value = newReps!=null ? newReps : "";
    }
  }
}
function cycleSetType(ei, si){
  var s = draft.exercises[ei].sets[si];
  var i = SET_TYPES.indexOf(s.setType);
  s.setType = SET_TYPES[(i+1)%SET_TYPES.length];
  saveDraft(); render();
  toast("Set type: " + s.setType);
}
function toggleSet(ei, si){
  var ex = draft.exercises[ei], s = ex.sets[si];
  s.done = !s.done;
  saveDraft();
  if(s.done){
    buzz(30);
    if(isPR(ex, s)){ toast("🏆 New PR — "+ex.name+" "+fmtNum(s.weight)+" kg × "+fmtNum(s.reps)+"!", 3400); chime([1046.5,1568]); }
    var allDone = draftCounts().done === draftCounts().total;
    if(ex.restSec>0 && !allDone) startRest(ex.restSec, ex.name);
  }
  render();
}
function addSet(ei){
  var ex = draft.exercises[ei];
  if(!ex) return;
  var cascadedWeight = null;
  for(var i=ex.sets.length-1;i>=0;i--){
    if(ex.sets[i].weight!=null){ cascadedWeight = ex.sets[i].weight; break; }
  }
  if(cascadedWeight==null && ex.prevSets && ex.prevSets.length){
    var p = ex.prevSets[ex.sets.length] ? ex.prevSets[ex.sets.length] : ex.prevSets[ex.prevSets.length-1];
    if(p && p.weightKg!=null) cascadedWeight = p.weightKg;
  }
  var cascadedReps = null;
  for(var k=ex.sets.length-1;k>=0;k--){
    if(ex.sets[k].reps!=null){ cascadedReps = ex.sets[k].reps; break; }
  }
  if(cascadedReps==null && ex.prevSets && ex.prevSets.length){
    var pr = ex.prevSets[ex.sets.length] ? ex.prevSets[ex.sets.length] : ex.prevSets[ex.prevSets.length-1];
    if(pr && pr.reps!=null) cascadedReps = pr.reps;
  }
  ex.sets.push({ setType:"normal", weight:cascadedWeight, reps:cascadedReps, done:false });
  saveDraft(); render();
}
function deleteSet(ei, si){
  draft.exercises[ei].sets.splice(si,1);
  if(!draft.exercises[ei].sets.length) draft.exercises.splice(ei,1);
  saveDraft(); render();
}
function removeDraftExercise(ei){

function finishWorkout(){
  var c = draftCounts();
  if(c.done===0){ toast("Check at least one set first — only checked sets count."); return; }
  var kept = draft.exercises.map(function(ex){
    var sets = ex.sets.filter(function(s){ return s.done; }).map(function(s){
      return { setType:s.setType, weightKg:s.weight, reps:s.reps, completed:true };
    });
    if(!sets.length) return null;
    return { exerciseId: ex.exerciseId, name: ex.name, muscleGroup: ex.muscleGroup, sets: sets };
  }).filter(Boolean);
  var now = new Date();
  var w = { id:"w"+uid(), title: draft.title.trim()||defaultTitle(), routineId: draft.routineId,
    startedAt: draft.startedAt, endedAt: now.toISOString(),
    durationSec: Math.max(1, Math.round((now - new Date(draft.startedAt))/1000)), exercises: kept };
  /* count PRs against history before saving */
  var prCount = 0;
  kept.forEach(function(ex){
    var rb = bestsFor(ex.exerciseId).bestWeight;
    ex.sets.forEach(function(s){
      if(s.setType!=="warmup" && s.weightKg!=null && rb!=null && s.weightKg>rb){ prCount++; rb = s.weightKg; }
    });
  });
  w.prCount = prCount;
  S.workouts.push(w); save();
  draft = null; saveDraft(); stopRest();
  go("summary", w.id);
}

function ghNumbers(node, path, out){

function ghSleepPointInfo(p){

  if(s != null && e != null && e > s){
    var ih = (e - s) / 3600000;

  }
  var mins = ghPick(p, ["minutesasleep", "minutes"], 30, 1500);
  if(mins != null) return { hours: mins / 60, end: e || s || ghPointTime(p) || null };

function ghSleepSummary(json){

  // most recent night first, capped at 14 nights.

  if(!Array.isArray(pts) || !pts.length) return null;
  var byDay = {};
  pts.forEach(function(p){
    var info = ghSleepPointInfo(p);
    if(!info || !info.end) return;
    var ed = new Date(info.end);
    var day = ed.getFullYear() + "-" + String(ed.getMonth() + 1).padStart(2, "0") + "-" + String(ed.getDate()).padStart(2, "0");
    byDay[day] = (byDay[day] || 0) + info.hours;
  });
  var days = Object.keys(byDay).sort().reverse();
  if(!days.length) return null;
  var nights = days.slice(0, 14).map(function(d){ return { date: d, hours: Math.round(byDay[d] * 10) / 10 }; });

function ghExtract(kind, json){

  var latest = pts[0];
  if(kind === "weightKg"){
    var w = ghPick(latest, ["kilogram", "weightkg", "kg", "weight", "value"], 20, 400);
    if(w == null){ // value may be stored in grams
      var g = ghPick(latest, ["weight", "value"], 20000, 400000);
      if(g != null) w = Math.round(g / 10) / 100;
    }
    return w;
  }
  if(kind === "fatPercent"){
    var f = ghPick(latest, ["percent", "fat", "value"], 0.5, 80);
    if(f != null && f <= 1.5) f = Math.round(f * 1000) / 10; // stored as a fraction

      if(v == null) return;

      : kind === "calories" ? ["kcal", "calorie", "energy", "value"]

    pts.forEach(function(p){
      var v = ghPick(p, hints, 0, maxPt);
      if(v == null) return;
      var t = ghPointTime(p), day = t ? new Date(t).toDateString() : "all";

}

  }

    if(!token){

      calories: ["total-calories", "calories", "active-energy-burned"],
      activeMin: ["active-minutes", "active-zone-minutes"],

function csvEscape(v){ v = v==null?"":String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }

function parseCsv(text){
  var rows=[], row=[], cur="", inQ=false;
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=ch;
    } else if(ch==='"') inQ=true;
    else if(ch===","){ row.push(cur); cur=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cur); cur=""; if(row.length>1||row[0]!=="") rows.push(row); row=[]; }

    if(!w._map[ex.id]){ w._map[ex.id] = { exerciseId:ex.id, name:ex.name, muscleGroup:ex.muscleGroup, sets:[] }; w.exercises.push(w._map[ex.id]); }
    var wv = iW>=0 ? parseFloat(r[iW]) : null, rv = iR>=0 ? parseInt(r[iR],10) : null;
    w._map[ex.id].sets.push({ setType: (iType>=0 && r[iType]) ? r[iType].trim().toLowerCase() : "normal",
      weightKg: isNaN(wv)?null:wv, reps: isNaN(rv)?null:rv, completed:true });
  });
  var imported = order.map(function(k){
    var w = byKey[k]; delete w._map;
    w.exercises = w.exercises.filter(function(e){ return e.sets.length; });
    w.durationSec = Math.max(0, Math.round((new Date(w.endedAt)-new Date(w.startedAt))/1000));
    return w;
  }).filter(function(w){ return w.exercises.length; });
  if(!imported.length) throw new Error("no workouts found in file");
  S.workouts = S.workouts.concat(imported); save();
  render(); toast("Imported "+imported.length+" workouts from CSV 🎉");
}

/* ---------------- init ---------------- */
render();
</script>
